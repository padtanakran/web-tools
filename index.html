<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools Hub — รวมเครื่องมือด่วน</title>
  <meta name="description" content="คลังเครื่องมือด่วนใช้งานง่ายสไตล์ POS: เทียบราคา คิดเปอร์เซ็นต์ แปลงหน่วย สุ่มของกิน คำนวณดอกเบี้ย หารบิล ใช้งานออฟไลน์ได้ทันที">
  <meta name="theme-color" content="#f8fafc">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Tools Hub">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/jpeg" href="./assets/icons/icon-192.jpg">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.jpg">
  <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">ข้ามไปเนื้อหาหลัก</a>

  <!-- Header -->
  <header class="site-header" role="banner">
    <div class="container">
      <a href="./index.html" class="site-logo" aria-label="หน้าหลัก Tools Hub">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        Tools <span>Hub</span>
      </a>
      <div class="header-actions">
        <button type="button" class="theme-toggle-btn" aria-label="สลับโหมดมืด" title="สลับโหมดมืด"></button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main id="main-content" class="page-main">
    <div class="container">

      <!-- Install banner -->
      <div id="install-banner" class="install-banner hidden" role="region" aria-label="ติดตั้งแอป">
        <p><strong>ติดตั้ง Tools Hub</strong> — เพิ่มลงหน้าจอหลักเพื่อเปิดใช้งานออฟไลน์ได้ทันที</p>
        <div class="flex gap-sm">
          <button id="install-btn" class="btn btn-primary btn-sm">ติดตั้ง</button>
          <button id="install-dismiss" class="btn btn-secondary btn-sm" aria-label="ปิดการแจ้งเตือน">ปิด</button>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="search-bar" role="search">
        <div class="search-input-wrap">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input
            id="search-input"
            type="search"
            class="search-input"
            placeholder="ค้นหาเครื่องมือ..."
            aria-label="ค้นหาเครื่องมือ"
            autocomplete="off"
          >
        </div>
        <span id="tools-count" class="text-muted text-sm" aria-live="polite" aria-atomic="true"></span>
      </div>

      <!-- Category Filter Tabs (POS Pills) -->
      <nav id="category-tabs" class="filter-tabs" aria-label="กรองตามหมวดหมู่"></nav>

      <!-- Recently used (shown only if history exists) -->
      <section id="recent-section" class="hidden mb-lg" aria-labelledby="recent-title">
        <h2 class="section-title" id="recent-title">ใช้งานล่าสุด</h2>
        <div id="recent-grid" class="tools-grid pos-grid"></div>
      </section>

      <!-- POS Tools Grid -->
      <section aria-labelledby="all-tools-title">
        <h2 class="sr-only" id="all-tools-title">เครื่องมือทั้งหมด</h2>
        <div id="tools-grid" class="tools-grid pos-grid" role="list">
          <div class="empty-state" style="grid-column:1/-1" aria-live="polite">
            <p class="text-muted">กำลังโหลดเครื่องมือ...</p>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <p>Tools Hub &mdash; ทำงานออฟไลน์ได้ รวดเร็ว ปลอดภัย</p>
    </div>
  </footer>

  <script src="./assets/js/common.js"></script>
  <script src="./assets/js/app.js"></script>
</body>
</html>
