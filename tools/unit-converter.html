<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แปลงหน่วย — Tools Hub</title>
  <meta name="description" content="แปลงหน่วยวัดทุกชนิด ความยาว น้ำหนัก อุณหภูมิ ปริมาตร พื้นที่ และความเร็ว">
  <meta name="theme-color" content="#f8fafc">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/jpeg" href="../assets/icons/icon-192.jpg">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">ข้ามไปเนื้อหาหลัก</a>

  <header class="site-header" role="banner">
    <div class="container">
      <a href="../index.html" class="header-back" aria-label="กลับหน้าหลัก Tools Hub">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        หน้าหลัก
      </a>
      <a href="../index.html" class="site-logo" aria-label="หน้าหลัก Tools Hub">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        Tools <span>Hub</span>
      </a>
      <div class="header-actions">
        <button type="button" class="theme-toggle-btn" aria-label="สลับโหมดมืด" title="สลับโหมดมืด"></button>
      </div>
    </div>
  </header>

  <main id="main-content" class="page-main">
    <div class="container" style="max-width:640px;">
      <div class="page-header">
        <h1 class="page-title">แปลงหน่วย</h1>
        <p class="page-description">แปลงหน่วยวัดความยาว น้ำหนัก อุณหภูมิ ปริมาตร พื้นที่ และความเร็ว</p>
      </div>

      <!-- Category tabs -->
      <nav class="tabs" aria-label="หมวดหมู่หน่วย" role="tablist">
        <button class="tab-btn active" data-cat="length" role="tab" aria-selected="true">ความยาว</button>
        <button class="tab-btn"        data-cat="weight" role="tab" aria-selected="false">น้ำหนัก</button>
        <button class="tab-btn"        data-cat="temperature" role="tab" aria-selected="false">อุณหภูมิ</button>
        <button class="tab-btn"        data-cat="volume" role="tab" aria-selected="false">ปริมาตร</button>
        <button class="tab-btn"        data-cat="area" role="tab" aria-selected="false">พื้นที่</button>
        <button class="tab-btn"        data-cat="speed" role="tab" aria-selected="false">ความเร็ว</button>
      </nav>

      <div class="card">
        <div class="form-row" style="align-items:flex-end;flex-wrap:wrap;">
          <div class="form-group" style="flex:2;min-width:140px;">
            <label class="form-label" for="input-value">ค่าตัวเลข</label>
            <input id="input-value" type="number" class="form-input" placeholder="ใส่ตัวเลข" step="any">
          </div>
          <div class="form-group" style="flex:1.5;min-width:130px;">
            <label class="form-label" for="from-unit">จากหน่วย</label>
            <select id="from-unit" class="form-select"></select>
          </div>
          <div class="form-group" style="flex:1.5;min-width:130px;">
            <label class="form-label" for="to-unit">เป็นหน่วย</label>
            <select id="to-unit" class="form-select"></select>
          </div>
        </div>

        <div id="conv-result" class="result-box mt-md hidden"></div>

        <div class="flex gap-sm mt-md flex-wrap">
          <button id="convert-btn" class="btn btn-primary" style="flex:1;">แปลงค่า</button>
          <button id="swap-btn" class="btn btn-secondary" aria-label="สลับหน่วย">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
            สลับหน่วย
          </button>
        </div>
      </div>

      <!-- Quick reference table -->
      <div class="card mt-md">
        <h2 class="section-title">ตารางเทียบหน่วยทั้งหมด (<span id="ref-from-label"></span>)</h2>
        <div class="table-wrap">
          <table class="data-table" id="ref-table">
            <thead><tr><th>หน่วย</th><th>ผลลัพธ์</th></tr></thead>
            <tbody id="ref-body"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container"><p>Tools Hub &mdash; ทำงานออฟไลน์ได้ รวดเร็ว ปลอดภัย</p></div>
  </footer>

  <script src="../assets/js/common.js"></script>
  <script>
    (function () {
      'use strict';
      registerServiceWorker('../sw.js');
      recordToolVisit('unit-converter');

      const CATEGORIES = {
        length: {
          base: 'm',
          units: [
            { id: 'mm',   label: 'มิลลิเมตร (mm)',  factor: 0.001 },
            { id: 'cm',   label: 'เซนติเมตร (cm)',  factor: 0.01 },
            { id: 'm',    label: 'เมตร (m)',        factor: 1 },
            { id: 'km',   label: 'กิโลเมตร (km)',   factor: 1000 },
            { id: 'in',   label: 'นิ้ว (in)',        factor: 0.0254 },
            { id: 'ft',   label: 'ฟุต (ft)',        factor: 0.3048 },
            { id: 'yd',   label: 'หลา (yd)',        factor: 0.9144 },
            { id: 'mi',   label: 'ไมล์ (mi)',       factor: 1609.344 },
          ]
        },
        weight: {
          base: 'kg',
          units: [
            { id: 'mg',  label: 'มิลลิกรัม (mg)', factor: 0.000001 },
            { id: 'g',   label: 'กรัม (g)',       factor: 0.001 },
            { id: 'kg',  label: 'กิโลกรัม (kg)',  factor: 1 },
            { id: 't',   label: 'ตัน (t)',        factor: 1000 },
            { id: 'oz',  label: 'ออนซ์ (oz)',     factor: 0.028349523 },
            { id: 'lb',  label: 'ปอนด์ (lb)',     factor: 0.45359237 },
          ]
        },
        temperature: {
          special: true,
          units: [
            { id: 'C', label: 'เซลเซียส (°C)' },
            { id: 'F', label: 'ฟาเรนไฮต์ (°F)' },
            { id: 'K', label: 'เคลวิน (K)' },
          ]
        },
        volume: {
          base: 'l',
          units: [
            { id: 'ml',    label: 'มิลลิลิตร (ml)', factor: 0.001 },
            { id: 'l',     label: 'ลิตร (L)',       factor: 1 },
            { id: 'm3',    label: 'ลูกบาศก์เมตร (m³)', factor: 1000 },
            { id: 'tsp',   label: 'ช้อนชา (tsp)',   factor: 0.00492892 },
            { id: 'tbsp',  label: 'ช้อนโต๊ะ (tbsp)', factor: 0.01478676 },
            { id: 'cup',   label: 'ถ้วยตวง (cup)',   factor: 0.23658824 },
            { id: 'gal',   label: 'แกลลอน (gal US)', factor: 3.7854118 },
          ]
        },
        area: {
          base: 'm2',
          units: [
            { id: 'sq_m',  label: 'ตารางเมตร (ตร.ม.)', factor: 1 },
            { id: 'sq_km', label: 'ตารางกิโลเมตร (ตร.กม.)', factor: 1000000 },
            { id: 'rai',   label: 'ไร่ (1,600 ตร.ม.)', factor: 1600 },
            { id: 'ngan',  label: 'งาน (400 ตร.ม.)', factor: 400 },
            { id: 'sq_wa', label: 'ตารางวา (4 ตร.ม.)', factor: 4 },
            { id: 'sq_ft', label: 'ตารางฟุต (sq ft)', factor: 0.09290304 },
            { id: 'acre',  label: 'เอเคอร์ (Acre)', factor: 4046.8564 },
          ]
        },
        speed: {
          base: 'ms',
          units: [
            { id: 'kmh',  label: 'กิโลเมตร/ชั่วโมง (km/h)', factor: 0.27777778 },
            { id: 'ms',   label: 'เมตร/วินาที (m/s)',     factor: 1 },
            { id: 'mph',  label: 'ไมล์/ชั่วโมง (mph)',     factor: 0.44704 },
            { id: 'kt',   label: 'น็อต (Knot)',            factor: 0.51444444 },
          ]
        },
      };

      let activeCat = 'length';

      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCat = btn.dataset.cat;
          document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected','false'); });
          btn.classList.add('active');
          btn.setAttribute('aria-selected','true');
          populateUnits();
          clearResult();
        });
      });

      function populateUnits() {
        const cat = CATEGORIES[activeCat];
        const fromSel = $id('from-unit');
        const toSel = $id('to-unit');
        fromSel.innerHTML = '';
        toSel.innerHTML = '';
        cat.units.forEach(u => {
          fromSel.appendChild(new Option(u.label, u.id));
          toSel.appendChild(new Option(u.label, u.id));
        });
        toSel.selectedIndex = Math.min(1, cat.units.length - 1);
        updateRefTable();
      }

      function clearResult() {
        $id('conv-result').classList.add('hidden');
      }

      function convertTemp(val, from, to) {
        let celsius;
        if (from === 'C') celsius = val;
        else if (from === 'F') celsius = (val - 32) * 5/9;
        else if (from === 'K') celsius = val - 273.15;

        if (to === 'C') return celsius;
        if (to === 'F') return celsius * 9/5 + 32;
        if (to === 'K') return celsius + 273.15;
      }

      function doConvert(val, fromId, toId) {
        const cat = CATEGORIES[activeCat];
        if (cat.special) return convertTemp(val, fromId, toId);
        const fromUnit = cat.units.find(u => u.id === fromId);
        const toUnit = cat.units.find(u => u.id === toId);
        return val * fromUnit.factor / toUnit.factor;
      }

      function convert() {
        const val = safeFloat($id('input-value').value);
        const fromId = $id('from-unit').value;
        const toId = $id('to-unit').value;
        const cat = CATEGORIES[activeCat];
        const fromLabel = cat.units.find(u => u.id === fromId).label;
        const toLabel = cat.units.find(u => u.id === toId).label;

        const result = doConvert(val, fromId, toId);
        const el = $id('conv-result');
        el.innerHTML = `
          <div class="result-label">${formatNumber(val, 4)} ${fromLabel} =</div>
          <div class="result-value">${formatNumber(result, 4)}</div>
          <div class="result-sub">${toLabel}</div>
        `;
        el.classList.remove('hidden');
        updateRefTable();
      }

      function updateRefTable() {
        const val = safeFloat($id('input-value').value) || 1;
        const fromId = $id('from-unit').value;
        const cat = CATEGORIES[activeCat];
        const fromUnit = cat.units.find(u => u.id === fromId);
        $id('ref-from-label').textContent = fromUnit ? fromUnit.label : '';

        const tbody = $id('ref-body');
        tbody.innerHTML = '';
        cat.units.forEach(u => {
          if (u.id === fromId) return;
          const res = doConvert(val, fromId, u.id);
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${u.label}</td><td class="font-mono"><strong>${formatNumber(res, 4)}</strong></td>`;
          tbody.appendChild(tr);
        });
      }

      $id('convert-btn').addEventListener('click', convert);
      $id('input-value').addEventListener('keydown', e => { if (e.key === 'Enter') convert(); });

      $id('swap-btn').addEventListener('click', () => {
        const from = $id('from-unit');
        const to = $id('to-unit');
        const tmp = from.value;
        from.value = to.value;
        to.value = tmp;
        if ($id('input-value').value) convert();
      });

      $id('from-unit').addEventListener('change', () => { if ($id('input-value').value) convert(); else updateRefTable(); });
      $id('to-unit').addEventListener('change', () => { if ($id('input-value').value) convert(); });

      populateUnits();
    })();
  </script>
</body>
</html>
