<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เทียบราคา — Tools Hub</title>
  <meta name="description" content="เปรียบเทียบราคาสินค้าต่อหน่วย คำนวณเรียลไทม์ หาตัวเลือกที่คุ้มและประหยัดที่สุด">
  <meta name="theme-color" content="#f8fafc">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/jpeg" href="../assets/icons/icon-192.jpg">
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .item-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: var(--space-md);
      transition: border-color .2s, box-shadow .2s;
    }

    .item-card.is-winner {
      border: 2px solid var(--success);
      box-shadow: 0 0 0 1px var(--success), var(--shadow);
    }

    .item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      margin-bottom: var(--space-sm);
      flex-wrap: wrap;
    }

    .item-name-input {
      font-weight: 600;
      font-size: var(--text-base);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text);
      padding: 4px 8px;
      min-width: 140px;
      flex: 1;
      transition: border-color .2s, background-color .2s;
    }

    .item-name-input:focus {
      border-color: var(--border-focus);
      background: var(--surface-alt);
      outline: none;
    }

    .item-header-meta {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .item-ppu-tag {
      font-size: var(--text-sm);
      font-weight: 600;
      color: var(--text-muted);
      background: var(--surface-alt);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .item-card.is-winner .item-ppu-tag {
      color: var(--success);
      border-color: var(--success);
      background: rgba(16, 185, 129, 0.08);
    }

    .btn-delete-item {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-faint);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      font-size: var(--text-xs);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: color .2s, border-color .2s;
    }

    .btn-delete-item:hover {
      color: var(--danger);
      border-color: var(--danger);
      background: rgba(239, 68, 68, 0.06);
    }

    .actions-row {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
    }

    .result-section {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius);
      padding: var(--space-lg);
      transition: border-color .2s, background-color .2s;
    }

    .result-section.has-winner {
      border: 2px solid var(--success);
    }

    .winner-highlight-box {
      background: rgba(16, 185, 129, 0.06);
      border: 1px solid var(--success);
      border-radius: var(--radius-sm);
      padding: var(--space-md);
      margin-bottom: var(--space-md);
    }

    .winner-highlight-box .winner-title {
      font-size: var(--text-xl);
      font-weight: 700;
      color: var(--text);
      margin-bottom: var(--space-xs);
    }

    .winner-highlight-box .winner-desc {
      font-size: var(--text-sm);
      color: var(--text-muted);
    }

    .winner-highlight-box .winner-badge {
      display: inline-block;
      margin-bottom: var(--space-xs);
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">ข้ามไปเนื้อหาหลัก</a>

  <header class="site-header" role="banner">
    <div class="container">
      <a href="../index.html" class="header-back" aria-label="กลับหน้าหลัก Tools Hub">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        หน้าหลัก
      </a>
      <a href="../index.html" class="site-logo" aria-label="หน้าหลัก Tools Hub">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        Tools <span>Hub</span>
      </a>
      <div class="header-actions">
        <button type="button" class="theme-toggle-btn" aria-label="สลับโหมดมืด" title="สลับโหมดมืด"></button>
      </div>
    </div>
  </header>

  <main id="main-content" class="page-main">
    <div class="container">
      <div class="page-header">
        <h1 class="page-title">เทียบราคา</h1>
        <p class="page-description">กรอกราคาและปริมาณลงในรายการด้านล่าง ระบบคำนวณและแสดงผลลัพธ์ทันทีที่ท้ายหน้า</p>
      </div>

      <!-- Items List -->
      <div id="items-list" class="mb-md"></div>

      <!-- Controls Row -->
      <div class="actions-row mb-lg">
        <button id="add-item-btn" type="button" class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          เพิ่มรายการ
        </button>
        <button id="clear-all-btn" type="button" class="btn btn-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          ล้างข้อมูล
        </button>
      </div>

      <!-- Bottom Results Section -->
      <div id="results-section" class="result-section" role="region" aria-live="polite">
        <div class="section-title">ผลการเปรียบเทียบ</div>
        <div id="results-container">
          <p class="text-muted">กรอกราคาและปริมาณอย่างน้อย 2 รายการเพื่อดูผลเปรียบเทียบ</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <p>Tools Hub &mdash; ทำงานออฟไลน์ได้ รวดเร็ว ปลอดภัย</p>
    </div>
  </footer>

  <script src="../assets/js/common.js"></script>
  <script>
    (function () {
      'use strict';
      registerServiceWorker('../sw.js');
      recordToolVisit('price-comparison');

      const itemsList = $id('items-list');
      const addItemBtn = $id('add-item-btn');
      const clearAllBtn = $id('clear-all-btn');
      const resultsSection = $id('results-section');
      const resultsContainer = $id('results-container');

      let itemCount = 0;

      function escHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function createItemRow(defaultName = '') {
        itemCount++;
        const id = itemCount;
        const name = defaultName || `รายการที่ ${id}`;
        const row = document.createElement('div');
        row.className = 'card card-sm item-card mb-md';
        row.id = `item-row-${id}`;
        row.innerHTML = `
          <div class="item-header">
            <input type="text" class="item-name-input item-name" value="${escHtml(name)}" placeholder="ชื่อรายการ" aria-label="ชื่อรายการ">
            <div class="item-header-meta">
              <span class="item-ppu-tag item-ppu-display">- / หน่วย</span>
              <button type="button" class="btn-delete-item" title="ลบรายการนี้" aria-label="ลบรายการที่ ${id}">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
                ลบ
              </button>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:1;min-width:120px;">
              <label class="form-label" for="price-${id}">ราคา</label>
              <input id="price-${id}" type="number" inputmode="decimal" class="form-input item-price" placeholder="0.00" min="0" step="any">
            </div>
            <div class="form-group" style="flex:1;min-width:120px;">
              <label class="form-label" for="qty-${id}">ปริมาณ</label>
              <input id="qty-${id}" type="number" inputmode="decimal" class="form-input item-qty" placeholder="1" min="0" step="any">
            </div>
          </div>
        `;

        row.querySelector('.btn-delete-item').addEventListener('click', () => {
          removeItemRow(row);
        });

        itemsList.appendChild(row);
        updateDeleteButtons();
        return row;
      }

      function removeItemRow(row) {
        if (itemsList.querySelectorAll('.item-card').length <= 2) return;
        row.remove();
        updateDeleteButtons();
        recalculate();
      }

      function updateDeleteButtons() {
        const rows = itemsList.querySelectorAll('.item-card');
        const canDelete = rows.length > 2;
        rows.forEach(row => {
          const btn = row.querySelector('.btn-delete-item');
          if (btn) btn.style.display = canDelete ? 'inline-flex' : 'none';
        });
      }

      function formatPpu(val) {
        if (val >= 100) return formatNumber(val, 2);
        if (val >= 1) return formatNumber(val, 3);
        return formatNumber(val, 4);
      }

      function recalculate() {
        const rows = Array.from(itemsList.querySelectorAll('.item-card'));
        const items = rows.map(row => {
          const nameInput = row.querySelector('.item-name');
          const priceInput = row.querySelector('.item-price');
          const qtyInput = row.querySelector('.item-qty');
          const ppuDisplay = row.querySelector('.item-ppu-display');

          const name = (nameInput.value || '').trim() || 'รายการ';
          const price = safeFloat(priceInput.value, 0);
          const qty = safeFloat(qtyInput.value, 0);

          let ppu = null;
          if (price > 0 && qty > 0) {
            ppu = price / qty;
          }

          return {
            row,
            name,
            price,
            qty,
            ppu,
            ppuDisplay
          };
        });

        // Update single row badge
        items.forEach(item => {
          if (item.ppu !== null) {
            item.ppuDisplay.textContent = `${formatPpu(item.ppu)} / หน่วย`;
          } else {
            item.ppuDisplay.textContent = '- / หน่วย';
            item.row.classList.remove('is-winner');
          }
        });

        const validItems = items.filter(item => item.ppu !== null);

        if (validItems.length < 2) {
          resultsSection.classList.remove('has-winner');
          resultsContainer.innerHTML = '<p class="text-muted">กรอกราคาและปริมาณอย่างน้อย 2 รายการเพื่อดูผลเปรียบเทียบ</p>';
          items.forEach(i => i.row.classList.remove('is-winner'));
          return;
        }

        const minPpu = Math.min(...validItems.map(i => i.ppu));
        const maxPpu = Math.max(...validItems.map(i => i.ppu));
        const winners = validItems.filter(i => Math.abs(i.ppu - minPpu) < 0.000001);

        if (minPpu === maxPpu) {
          resultsSection.classList.remove('has-winner');
          items.forEach(i => i.row.classList.remove('is-winner'));
          resultsContainer.innerHTML = `
            <div class="winner-highlight-box">
              <span class="badge badge-primary winner-badge">ราคาเท่ากัน</span>
              <div class="winner-title">ทุกรายการราคาต่อหน่วยเท่ากัน</div>
              <div class="winner-desc">ราคาเฉลี่ย ${formatPpu(minPpu)} ต่อหน่วย</div>
            </div>
            ${renderTable(validItems, minPpu)}
          `;
          return;
        }

        const winner = winners[0];
        const others = validItems.filter(i => !winners.includes(i));
        const secondBestPpu = Math.min(...others.map(i => i.ppu));
        const savingsVsSecond = ((secondBestPpu - minPpu) / secondBestPpu * 100).toFixed(1);

        resultsSection.classList.add('has-winner');

        items.forEach(item => {
          if (winners.includes(item)) {
            item.row.classList.add('is-winner');
          } else {
            item.row.classList.remove('is-winner');
          }
        });

        resultsContainer.innerHTML = `
          <div class="winner-highlight-box">
            <span class="badge badge-success winner-badge">คุ้มค่าที่สุด</span>
            <div class="winner-title">${escHtml(winner.name)} คุ้มที่สุด</div>
            <div class="winner-desc">ราคา ${formatPpu(minPpu)} ต่อหน่วย (ประหยัดกว่าตัวเลือกถัดไป ${savingsVsSecond}%)</div>
          </div>
          ${renderTable(validItems, minPpu)}
        `;
      }

      function renderTable(validItems, minPpu) {
        const sorted = [...validItems].sort((a, b) => a.ppu - b.ppu);
        const rowsHtml = sorted.map(item => {
          const isWinner = Math.abs(item.ppu - minPpu) < 0.000001;
          const diffPct = isWinner ? '' : `แพงกว่า ${((item.ppu - minPpu) / minPpu * 100).toFixed(1)}%`;
          return `
            <tr ${isWinner ? 'class="best"' : ''}>
              <td><strong>${escHtml(item.name)}</strong></td>
              <td>${formatNumber(item.price)} / ${formatNumber(item.qty, 0)}</td>
              <td><strong>${formatPpu(item.ppu)}</strong></td>
              <td>
                ${isWinner ? '<span class="badge badge-success">คุ้มที่สุด</span>' : `<span class="text-danger font-semibold text-xs">${diffPct}</span>`}
              </td>
            </tr>
          `;
        }).join('');

        return `
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>รายการ</th>
                  <th>ราคา / ปริมาณ</th>
                  <th>ราคาต่อหน่วย</th>
                  <th>ผลลัพธ์</th>
                </tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        `;
      }

      function init() {
        itemsList.innerHTML = '';
        itemCount = 0;
        createItemRow('รายการที่ 1');
        createItemRow('รายการที่ 2');
        recalculate();
      }

      // Live updates
      itemsList.addEventListener('input', recalculate);
      itemsList.addEventListener('change', recalculate);

      addItemBtn.addEventListener('click', () => {
        const row = createItemRow();
        recalculate();
        const priceInput = row.querySelector('.item-price');
        if (priceInput) priceInput.focus();
      });

      clearAllBtn.addEventListener('click', () => {
        init();
        const firstPrice = itemsList.querySelector('.item-price');
        if (firstPrice) firstPrice.focus();
      });

      init();
    })();
  </script>
</body>
</html>
