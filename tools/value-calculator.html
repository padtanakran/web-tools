<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คิดความคุ้ม — Tools Hub</title>
  <meta name="description" content="คำนวณและให้คะแนนความคุ้มค่าของสินค้าตามราคา คุณภาพ และปริมาณ">
  <meta name="theme-color" content="#f8fafc">
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" type="image/jpeg" href="../assets/icons/icon-192.jpg">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">ข้ามไปเนื้อหาหลัก</a>

  <header class="site-header" role="banner">
    <div class="container">
      <a href="../index.html" class="header-back" aria-label="กลับหน้าหลัก Tools Hub">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        หน้าหลัก
      </a>
      <a href="../index.html" class="site-logo" aria-label="หน้าหลัก Tools Hub">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        Tools <span>Hub</span>
      </a>
      <div class="header-actions">
        <button type="button" class="theme-toggle-btn" aria-label="สลับโหมดมืด" title="สลับโหมดมืด"></button>
      </div>
    </div>
  </header>

  <main id="main-content" class="page-main">
    <div class="container">
      <div class="page-header">
        <h1 class="page-title">คิดความคุ้ม</h1>
        <p class="page-description">ให้คะแนนสินค้าตามราคา คุณภาพ และปริมาณ หาของที่คุ้มค่าจริง</p>
      </div>

      <!-- Weight settings -->
      <div class="card mb-md">
        <div class="section-title">สัดส่วนความสำคัญ (รวม 100%)</div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="w-price">น้ำหนักราคา (%)</label>
            <input id="w-price" type="number" class="form-input" value="50" min="0" max="100">
          </div>
          <div class="form-group">
            <label class="form-label" for="w-quality">น้ำหนักคุณภาพ (%)</label>
            <input id="w-quality" type="number" class="form-input" value="30" min="0" max="100">
          </div>
          <div class="form-group">
            <label class="form-label" for="w-quantity">น้ำหนักปริมาณ (%)</label>
            <input id="w-quantity" type="number" class="form-input" value="20" min="0" max="100">
          </div>
        </div>
        <p class="text-muted text-sm mt-sm">รวมทั้งหมด: <strong id="weight-total">100%</strong></p>
      </div>

      <!-- Add product -->
      <div class="card mb-md">
        <div class="section-title">เพิ่มสินค้า</div>
        <div class="form-row" style="flex-wrap:wrap;">
          <div class="form-group" style="flex:2;min-width:140px;">
            <label class="form-label" for="prod-name">ชื่อสินค้า</label>
            <input id="prod-name" type="text" class="form-input" placeholder="เช่น แบรนด์ A หรือ แบบกล่อง">
          </div>
          <div class="form-group" style="flex:1;min-width:90px;">
            <label class="form-label" for="prod-price">ราคา (฿)</label>
            <input id="prod-price" type="number" class="form-input" placeholder="0.00" min="0" step="0.01">
          </div>
          <div class="form-group" style="flex:1;min-width:90px;">
            <label class="form-label" for="prod-quality">คุณภาพ (1–10)</label>
            <input id="prod-quality" type="number" class="form-input" placeholder="7" min="1" max="10">
          </div>
          <div class="form-group" style="flex:1;min-width:90px;">
            <label class="form-label" for="prod-qty">ปริมาณ</label>
            <input id="prod-qty" type="number" class="form-input" placeholder="1" min="0.001" step="any">
          </div>
        </div>
        <button id="add-prod-btn" class="btn btn-secondary mt-sm">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          เพิ่มรายการ
        </button>
      </div>

      <!-- Products list & calculate -->
      <div id="products-section" class="hidden">
        <div class="card mb-md table-wrap">
          <table class="data-table" id="products-table">
            <thead>
              <tr><th>สินค้า</th><th>ราคา</th><th>คุณภาพ</th><th>ปริมาณ</th><th>จัดการ</th></tr>
            </thead>
            <tbody id="products-body"></tbody>
          </table>
        </div>
        <button id="calc-btn" class="btn btn-primary btn-lg btn-block mb-lg">คำนวณความคุ้มค่า</button>
      </div>

      <!-- Results -->
      <div id="results-section" class="hidden">
        <h2 class="section-title">คะแนนความคุ้มค่า</h2>
        <div class="card table-wrap mb-md">
          <table class="data-table" id="results-table">
            <thead>
              <tr><th>สินค้า</th><th>คะแนนความคุ้ม</th><th>ผลลัพธ์</th></tr>
            </thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>
        <div id="winner-box" class="result-box"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container"><p>Tools Hub &mdash; ทำงานออฟไลน์ได้ รวดเร็ว ปลอดภัย</p></div>
  </footer>

  <script src="../assets/js/common.js"></script>
  <script>
    (function () {
      'use strict';
      registerServiceWorker('../sw.js');
      recordToolVisit('value-calculator');

      let products = [];
      let nextId = 1;

      function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

      ['w-price','w-quality','w-quantity'].forEach(id => {
        $id(id).addEventListener('input', updateWeightTotal);
      });

      function updateWeightTotal() {
        const total = safeFloat($id('w-price').value) + safeFloat($id('w-quality').value) + safeFloat($id('w-quantity').value);
        const el = $id('weight-total');
        el.textContent = total + '%';
        el.style.color = total === 100 ? 'var(--success)' : 'var(--warning)';
      }

      updateWeightTotal();

      $id('add-prod-btn').addEventListener('click', () => {
        const name = $id('prod-name').value.trim() || `สินค้า ${nextId}`;
        const price = safeFloat($id('prod-price').value);
        const quality = clamp(safeFloat($id('prod-quality').value, 5), 1, 10);
        const qty = safeFloat($id('prod-qty').value, 1) || 1;

        products.push({ id: nextId++, name, price, quality, qty });
        renderProductsTable();
        $id('prod-name').value = '';
        $id('prod-price').value = '';
        $id('prod-quality').value = '';
        $id('prod-qty').value = '';
        $id('prod-name').focus();
      });

      function renderProductsTable() {
        const tbody = $id('products-body');
        tbody.innerHTML = '';
        products.forEach(p => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><strong>${esc(p.name)}</strong></td>
            <td>฿${p.price > 0 ? formatNumber(p.price) : '--'}</td>
            <td>${p.quality}/10</td>
            <td>${formatNumber(p.qty, 0)}</td>
            <td><button class="btn btn-danger btn-sm" data-id="${p.id}" aria-label="ลบ ${esc(p.name)}">ลบ</button></td>
          `;
          tbody.appendChild(tr);
        });
        $id('products-section').classList.toggle('hidden', products.length < 1);
        $id('results-section').classList.add('hidden');

        tbody.querySelectorAll('[data-id]').forEach(btn => {
          btn.addEventListener('click', () => {
            products = products.filter(p => p.id !== +btn.dataset.id);
            renderProductsTable();
          });
        });
      }

      $id('calc-btn').addEventListener('click', () => {
        if (products.length < 2) { alert('กรุณาเพิ่มสินค้าอย่างน้อย 2 รายการ'); return; }

        const wp = safeFloat($id('w-price').value) / 100;
        const wq = safeFloat($id('w-quality').value) / 100;
        const wn = safeFloat($id('w-quantity').value) / 100;

        if (Math.abs(wp + wq + wn - 1) > 0.01) {
          alert('สัดส่วนเปอร์เซ็นต์รวมต้องเท่ากับ 100%');
          return;
        }

        const maxPrice = Math.max(...products.map(p => p.price)) || 1;
        const maxQty = Math.max(...products.map(p => p.qty)) || 1;

        products.forEach(p => {
          const priceScore = p.price > 0 ? (1 - p.price / maxPrice) * 100 : 0;
          const qualScore = (p.quality / 10) * 100;
          const qtyScore = (p.qty / maxQty) * 100;
          p.valueScore = wp * priceScore + wq * qualScore + wn * qtyScore;
        });

        const sorted = [...products].sort((a, b) => b.valueScore - a.valueScore);
        const best = sorted[0];

        const tbody = $id('results-body');
        tbody.innerHTML = '';
        sorted.forEach((p, i) => {
          const tr = document.createElement('tr');
          if (i === 0) tr.classList.add('best');
          tr.innerHTML = `
            <td><strong>${esc(p.name)}</strong></td>
            <td><strong>${formatNumber(p.valueScore, 1)}</strong> / 100</td>
            <td>${i === 0 ? '<span class="badge badge-success">คุ้มค่าที่สุด!</span>' : `<span class="text-muted text-xs">อันดับ ${i+1}</span>`}</td>
          `;
          tbody.appendChild(tr);
        });

        $id('winner-box').innerHTML = `
          <div class="result-label">สินค้าที่คุ้มค่าที่สุด</div>
          <div class="result-value">${esc(best.name)}</div>
          <div class="result-sub">คะแนนความคุ้มค่า: ${formatNumber(best.valueScore, 1)} / 100</div>
        `;

        $id('results-section').classList.remove('hidden');
        $id('results-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    })();
  </script>
</body>
</html>
